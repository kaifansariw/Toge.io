<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c78e8"/>
      <stop offset="100%" stop-color="#5551d4"/>
    </linearGradient>
    <linearGradient id="stroke-glow" x1="120" y1="380" x2="390" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0deff" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3a37a0" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Subtle inner highlight -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Collaborative drawing stroke — a flowing curve representing the act of drawing together -->
  <path
    d="M 140 340 C 160 280, 200 200, 260 200 C 320 200, 300 300, 340 260 C 380 220, 360 160, 380 150"
    stroke="url(#stroke-glow)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#inner-glow)"
  />

  <!-- Pen tip at the end of the stroke -->
  <g transform="translate(380, 150) rotate(-55)">
    <!-- Pen body -->
    <rect x="-8" y="-48" width="16" height="40" rx="3" fill="white" opacity="0.95"/>
    <!-- Pen tip -->
    <polygon points="0,0 -8,-8 8,-8" fill="white" opacity="0.95"/>
    <!-- Pen accent band -->
    <rect x="-8" y="-20" width="16" height="4" rx="1" fill="#6965db" opacity="0.6"/>
  </g>

  <!-- Second cursor / pen (collaboration indicator) — smaller, offset -->
  <g transform="translate(230, 245) rotate(-45)" opacity="0.7">
    <rect x="-5" y="-32" width="10" height="26" rx="2" fill="white" opacity="0.85"/>
    <polygon points="0,0 -5,-6 5,-6" fill="white" opacity="0.85"/>
    <rect x="-5" y="-14" width="10" height="3" rx="1" fill="#a5a2f0" opacity="0.5"/>
  </g>

  <!-- Small dots representing collaboration / multiple cursors -->
  <circle cx="155" cy="330" r="6" fill="white" opacity="0.5"/>
  <circle cx="175" cy="310" r="4" fill="white" opacity="0.35"/>
</svg>
